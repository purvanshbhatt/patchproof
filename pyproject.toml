[project]
name = "patchproof-repro"
version = "0.1.0"
description = "Deterministic exploit repro + AI patch verification engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PatchProof" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "docker>=7.1",
  "litellm>=1.50",
  "pydantic>=2.7",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
sign = ["cryptography>=42"]
mcp = ["mcp>=1.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
patchproof = "patchproof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchproof"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "PIE", "PLC", "PLW", "S"]
ignore = [
  "B008",   # typer.Option()/typer.Argument() in defaults is the typer idiom
  "BLE001", # best-effort cleanup paths intentionally catch broadly
  "PLW1510",# subprocess.run default check=False is deliberate in sandbox code
  "S110",   # try-except-pass in best-effort docker cleanup
  "S112",   # try-except-continue in file scanning
  "S603",   # subprocess with fixed argv, not user input
  "S607",   # partial executable path (docker) resolved via PATH by design
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts, fixture 0.0.0.0 bind, lazy import of optional cryptography
"tests/**" = ["S101", "S104", "PLC0415"]
# lazy imports keep CLI startup fast and optional deps optional
"src/patchproof/**" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests that require Docker",
]
