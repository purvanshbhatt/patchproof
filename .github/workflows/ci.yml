name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Unit + integration tests
        run: pytest

  self-verify:
    # Demonstrates PatchProof gating itself: the bundled exploit must be blocked
    # by the bundled fix, with variants and regression tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Verify FastAPI SQLi fix
        run: |
          patchproof verify \
            --app tests/fixtures/vuln-fastapi-sqli/app \
            --poc tests/fixtures/vuln-fastapi-sqli/poc.txt \
            --patch tests/fixtures/vuln-fastapi-sqli/fix.patch \
            --runner local
      - name: Verify Flask path-traversal fix
        run: |
          patchproof verify \
            --app tests/fixtures/vuln-flask-pathtraversal/app \
            --poc tests/fixtures/vuln-flask-pathtraversal/poc.txt \
            --patch tests/fixtures/vuln-flask-pathtraversal/fix.patch \
            --runner local
